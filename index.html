<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Pa-Kua - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- CABEÇALHO -->
    <header class="header-avaliacao">
        <div class="marca">
            <!-- Futuramente colocar aqui: logo do ideograma Pa-Kua -->
            <div class="logo-placeholder">☯</div>
            <div>
                <h1>PA-KUA</h1>
                <span>Sistema de Avaliação</span>
            </div>
        </div>

        <!-- Seletor de Modalidade (conectado ao formulário pelo atributo 'form') -->
        <select id="modalidade" class="select-modalidade" required form="formCadastro">
            <option disabled selected>Modalidade</option>
            <option>Arte Marcial</option>
            <option>Arqueria</option>
            <option>Armas de Corte</option>
            <option>Acrobacia</option>
            <option>Pa-Kua Ritmo</option>
            <option>Cosmodinâmica</option>
            <option>Sintonia</option>
            <option>Pa-Kua Chi</option>
        </select>
    </header>

    <!-- TÍTULO DA PÁGINA -->
    <section class="titulo-formulario">
        <h2>Cadastro de Aluno</h2>
        <p>Preencha as informações para iniciar uma nova avaliação.</p>
    </section>

    <!-- ÁREA DO FORMULÁRIO -->
    <div class="container">
        <form id="formCadastro">
            
            <div class="form-group">
                <label>Foto do Aluno</label>
                <input type="file" id="fotoAluno" accept="image/*" hidden>
                <label for="fotoAluno" class="btn-upload" id="labelFoto">
                    <span class="icone-upload">📷</span>
                    <strong>Adicionar Foto</strong>
                    <small>Clique para selecionar</small>
                </label>
            </div>
            
            <div class="form-row">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            
            <div class="form-row">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" required>
            </div>
            
            <div class="form-row">
                <label for="orientador">Orientador(a):</label>
                <input type="text" id="orientador" required>
            </div>
            
            <div class="form-row">
                <label for="recinto">Recinto (Escola/Local):</label>
                <input type="text" id="recinto" placeholder="Ex: Meireles, Fátima, Jacarey, etc." required>
            </div>
            
            <div class="form-row">
                <label for="graduacaoAtual">Graduação/Faixa Atual:</label>
                <select id="graduacaoAtual" required>
                    <option value="" disabled selected>Selecione a faixa...</option>
                    <option value="Branca">Branca</option>
                    <option value="Amarela">Amarela</option>
                    <option value="Laranja">Laranja</option>
                    <option value="Verde">Verde</option>
                    <option value="Cinza">Cinza</option>
                    <option value="Azul">Azul</option>
                    <option value="Vermelha">Vermelha</option>
                    <option value="I Grau">I Grau</option>
                    <option value="II Grau">II Grau</option>
                    <option value="III Grau">III Grau</option>
                </select>
            </div>
            
            <div class="form-row">
                <label for="faixaNova">Avaliando para a Faixa/Nível:</label>
                <select id="faixaNova" required>
                    <option value="" disabled selected>Selecione a faixa...</option>
                    <option value="Amarela">Amarela</option>
                    <option value="Laranja">Laranja</option>
                    <option value="Verde">Verde</option>
                    <option value="Cinza">Cinza</option>
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" min="0" required>
                </div>
                <div class="form-group">
                    <label for="tempoFaixa">Tempo na Faixa:</label>
                    <input type="text" id="tempoFaixa" placeholder="Ex: 6 meses" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone / WhatsApp:</label>
                    <input type="tel" id="telefone" placeholder="(XX) 9XXXX-XXXX" required>
                </div>
            </div>
            
            <div class="form-group">
                <label>Tipo de Avaliação:</label>
                <div class="checkbox-group">
                    <label class="checkbox-inline"><input type="checkbox" id="avalFaixa" checked> Faixa</label>
                    <label class="checkbox-inline"><input type="checkbox" id="avalDistintivo"> Distintivo</label>
                </div>
            </div>
            
            <div class="form-group">
                <div class="checkbox-group" style="margin-top: 15px;">
                    <label class="checkbox-inline" style="font-weight: bold;">
                        <input type="checkbox" id="pagou"> Avaliação Paga
                    </label>
                </div>
            </div>

            <button type="submit">Cadastrar Avaliação</button>
            <div id="mensagemSucesso">Aluno cadastrado com sucesso!</div>
        </form>
    </div>

    <!-- BOTÃO FLUTUANTE -->
    <a href="cards.html" class="btn-flutuante">📋 Avaliações</a>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="config.js"></script> <!-- Adicionado o config.js aqui também -->
    <script src="EvalPKapp.js"></script>

    <!-- RODAPÉ -->
    <footer>
        Sistema de Avaliação Pa-Kua © 2026
    </footer>

</body>
</html>
