<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Pa-Kua - Cadastro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2>Cadastro de Avaliação - Pa-Kua</h2>

        <form id="formCadastro">
            <div class="form-group">
                <label for="fotoAluno">Foto do Aluno (Tire a foto ou escolha do celular):</label>
                <input type="file" id="fotoAluno" accept="image/*">
            </div>

            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label for="sobrenome">Sobrenome:</label>
                <input type="text" id="sobrenome" required>
            </div>
            <div class="form-group">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" min="0" required>
            </div>
            <div class="form-group">
                <label for="orientador">Orientador(a):</label>
                <input type="text" id="orientador" required>
            </div>
            <div class="form-group">
                <label for="recinto">Recinto (Escola/Local):</label>
                <input type="text" id="recinto" placeholder="Ex: Central, Juvevê, etc." required>
            </div>
            <div class="form-group">
                <label for="graduacaoAtual">Graduação/Faixa Atual:</label>
                <select id="graduacaoAtual" required>
                    <option value="" disabled selected>Selecione a faixa...</option>
                    <option value="Branca">Branca</option>
                    <option value="Amarela">Amarela</option>
                    <option value="Laranja">Laranja</option>
                    <option value="Verde">Verde</option>
                    <option value="Cinza">Cinza</option>
                    <option value="Azul">Azul</option>
                    <option value="Vermelha">Vermelha</option>
                    <option value="I Grau">I Grau</option>
                    <option value="II Grau">II Grau</option>
                    <option value="III Grau">III Grau</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tempoFaixa">Tempo com a Faixa Atual:</label>
                <input type="text" id="tempoFaixa" placeholder="Ex: 6 meses, 1 ano" required>
            </div>
            <div class="form-group">
                <label for="faixaNova">Avaliando para a Faixa/Nível:</label>
                <select id="faixaNova" required>
                    <option value="" disabled selected>Selecione a faixa...</option>
                    <option value="Amarela">Amarela</option>
                    <option value="Laranja">Laranja</option>
                    <option value="Verde">Verde</option>
                    <option value="Cinza">Cinza</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tipo de Avaliação:</label>
                <div class="checkbox-group">
                    <label class="checkbox-inline"><input type="checkbox" id="avalFaixa" checked> Faixa</label>
                    <label class="checkbox-inline"><input type="checkbox" id="avalDistintivo"> Distintivo</label>
                </div>
            </div>
            <div class="form-group">
                <div class="checkbox-group" style="margin-top: 15px;">
                    <label class="checkbox-inline" style="font-weight: bold;"><input type="checkbox" id="pagou"> Pagou a
                        avaliação?</label>
                </div>
            </div>

            <button type="submit">Cadastrar Aluno</button>
            <div id="mensagemSucesso">Aluno cadastrado com sucesso!</div>
        </form>
    </div>
    <h1></h1>

    <a href="cards.html" class="btn-flutuante">Ver Cards ➔</a>

    <script src="EvalPKapp.js"></script>
</body>

</html>
