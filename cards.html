<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliação Pa-Kua</title>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="style02.css">
    <link rel="stylesheet" href="pdf.css">
</head>

<body>

    <div class="dashboard">

        <!-- ===============================
             CABEÇALHO PRINCIPAL
        ================================= -->
        <header class="cabecalho">

                <!-- Futuramente colocar aqui: logo do ideograma Pa-Kua -->
                <div class="logo-placeholder">☯</div>
                <div>
                    <h1 id="tituloPagina">Avaliação Pa-Kua</h1>

                </div>
            </div>

            <div class="botoes-topo">
            <!-- Botão Único de PDF -->
            <button class="btn btn-pdf" id="btnGerarPDF">
                📄 Gerar PDF
            </button>

            <button class="btn btn-limpar" onclick="limparDados()">
                🗑 Limpar Dados
            </button>
        </div>
            </div>

        ================================= -->

        ================================= -->
        <main class="cards-grid" id="listaCards">

    <!-- ===============================
         BOTÃO VOLTAR
    ================================= -->
    <a href="index.html" class="btn-flutuante">

         SCRIPTS
    ================================= -->

    <script src="config.js"></script>

    <script src="pdf.js"></script>
